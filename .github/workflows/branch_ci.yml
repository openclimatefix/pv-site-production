
name: Branch CI (Python)
run-name: 'Branch CI for ${{ github.event.head_commit.message }} by ${{ github.actor }}'

on:  
  push:
    branches-ignore: [ "main" ]
    paths-ignore: ['README.md']

permissions:
  packages: write
  contents: read

jobs:
  branch-ci-forecast-inference:
    uses: openclimatefix/.github/.github/workflows/branch_ci.yml@v2.0.0
    secrets: inherit
    with:
      enable_linting: true
      enable_typechecking: false
      tests_folder: tests
      containerfile: "infrastructure/Dockerfile.forecast-inference"
      working_directory: "forecast-inference"

  branch-ci-database-cleanup:
    uses: openclimatefix/.github/.github/workflows/branch_ci.yml@v2.0.0
    secrets: inherit
    with:
      enable_linting: true
      enable_typechecking: false
      tests_folder: tests
      containerfile: "infrastructure/Dockerfile.database-cleanup"
      working_directory: "database-cleanup"
    # runs after branch-ci-forecast-inference
    needs: branch-ci-forecast-inference
