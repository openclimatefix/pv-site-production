name: Tagged CI - Database Cleanup
run-name: 'Tagged CI (Database cleanup) for ${{ github.ref_name }} by ${{ github.actor }}'
on:
  push:
    tags: ["v*.*.*"]
permissions:
  packages: write
  contents: read
  id-token: write
jobs:
  tagged-ci-database-cleanup:
    uses: openclimatefix/.github/.github/workflows/tagged_ci.yml@main
    secrets: inherit
    with:
      containerfile: "infrastructure/Dockerfile.database-cleanup"
