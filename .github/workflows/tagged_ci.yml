name: Tagged CI
run-name: 'Tagged CI for ${{ github.ref_name }} by ${{ github.actor }}'
on:
  push:
    tags: ["v*.*.*"]
permissions:
  packages: write
  contents: read
  id-token: write
jobs:
  tagged-ci-forecast-inference:
    uses: openclimatefix/.github/.github/workflows/tagged_ci.yml@main
    secrets: inherit
    with:
      containerfile: "infrastructure/Dockerfile.forecast-inference"

  tagged-ci-database-cleanup:
    uses: openclimatefix/.github/.github/workflows/tagged_ci.yml@main
    secrets: inherit
    with:
      containerfile: "infrastructure/Dockerfile.database-cleanup"
